[package]
name = "open-ng"
version = "0.2.0"
description = "A programmable node editor library for native and browser applications."
edition.workspace = true
# The bundled font in fonts/ is under the SIL Open Font License.
license = "(MIT OR Apache-2.0) AND OFL-1.1"
repository = "https://github.com/joseph-wardle/OpenCompositor"
readme = "README.md"
publish = false

[lints]
workspace = true

[dependencies]
ab_glyph = { version = "0.2.32", default-features = false, features = ["std"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
rustc-hash = "1.1.0"
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "1.0.1"
wgpu = "30"
winit = "0.30.13"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3.106", features = [
    "AddEventListenerOptions",
    "console",
    "Document",
    "DomRect",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "KeyboardEvent",
    "MouseEvent",
    "Node",
    "OffscreenCanvas",
    "PointerEvent",
    "ResizeObserver",
    "ResizeObserverBoxOptions",
    "ResizeObserverEntry",
    "ResizeObserverOptions",
    "ResizeObserverSize",
    "WheelEvent",
    "Window",
] }
wgpu = { version = "30", features = ["webgl", "webgpu"] }
