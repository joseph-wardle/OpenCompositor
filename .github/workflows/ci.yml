name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  open-ng:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo build -p open-ng --all-targets --locked
      - run: cargo clippy -p open-ng --target wasm32-unknown-unknown --features wgpu/webgpu --locked -- -D warnings
      - run: cargo clippy -p open-ng --target wasm32-unknown-unknown --tests --locked -- -D warnings
      - run: cargo install wasm-bindgen-cli --locked --version "$(cargo pkgid wasm-bindgen | cut -d@ -f2)"
      # The runner has no GPU: Chrome draws WebGL2 with SwiftShader, which webdriver.json enables.
      - run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test -p open-ng --target wasm32-unknown-unknown --test web --locked
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
      - run: cargo package -p open-ng --locked
