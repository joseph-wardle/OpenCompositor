name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Pinned, never `ubuntu-latest`: its Mesa release decides what lavapipe accepts.
  workspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The GPU kernel tests fail without a Vulkan adapter; lavapipe is the runner's, and each
      # test prints the adapter and driver it ran on.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo fmt --all --check
      # The shell needs Qt, which the `shell` job installs.
      - run: cargo clippy --workspace --exclude opencompositor --all-targets --locked -- -D warnings
      - run: cargo build --workspace --exclude opencompositor --all-targets --locked
      # --nocapture: the kernel tests say which adapter and which CPU level ran.
      - run: cargo test --workspace --exclude opencompositor --locked -- --nocapture

  # Rebuilds the committed SPIR-V module with the builder's own nightly and fails on any byte
  # difference, so nobody needs that nightly to know the bytes are what the source builds. It
  # runs no tests: a passing comparison means the `workspace` job tested this module.
  shaders:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: compositor-kernels/shaders
    steps:
      - uses: actions/checkout@v7
      # rustup reads the builder's rust-toolchain.toml here, not the workspace's.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compositor-kernels/shaders
      - run: cargo run --locked
      - name: Compare with the committed module
        run: |
          if git diff --quiet -- ../kernels.spv; then exit 0; fi
          sudo apt-get update && sudo apt-get install -y spirv-tools
          diff <(git show HEAD:compositor-kernels/kernels.spv | spirv-dis -) <(spirv-dis ../kernels.spv) || true
          echo "::error::compositor-kernels/kernels.spv differs from the module rebuilt from source; the disassembly diff is above"
          exit 1

  shell:
    runs-on: ubuntu-latest
    env:
      QT_VERSION: 6.12.0
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # aqt's Qt links against the system's GL and loads its EGL, xkbcommon and fontconfig.
      - name: Install Qt's system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libegl1 libxkbcommon0 libfontconfig1
      # qtwayland carries the Wayland plugin; qtbase, with these archives, the private headers.
      - name: Install Qt with aqtinstall
        run: |
          pipx install aqtinstall==3.3.0
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 --outputdir "$RUNNER_TEMP/qt" --archives qtbase qtwayland icu
          qt="$RUNNER_TEMP/qt/$QT_VERSION/gcc_64"
          echo "QMAKE=$qt/bin/qmake" >> "$GITHUB_ENV"
          # The binary has no rpath, and would otherwise load a system Qt without a word.
          echo "LD_LIBRARY_PATH=$qt/lib" >> "$GITHUB_ENV"
      - run: cargo clippy -p opencompositor --all-targets --locked -- -D warnings
      - run: cargo build -p opencompositor --locked
      - run: cargo test -p opencompositor --locked

  open-ng:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p open-ng --all-targets --locked
      - run: cargo clippy -p open-ng --target wasm32-unknown-unknown --features wgpu/webgpu --locked -- -D warnings
      - run: cargo package -p open-ng --locked

  open-ng-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p open-ng --target wasm32-unknown-unknown --all-targets --locked -- -D warnings
      - name: Install the wasm-bindgen CLI matching Cargo.lock
        run: |
          version="$(cargo pkgid wasm-bindgen | cut -d@ -f2)"
          release="wasm-bindgen-$version-x86_64-unknown-linux-musl"
          url="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/$release.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSL "$url" -o "$release.tar.gz"
          echo "$(curl -fsSL "$url.sha256sum" | cut -d' ' -f1)  $release.tar.gz" | sha256sum -c
          tar xzf "$release.tar.gz"
          echo "$RUNNER_TEMP/$release" >> "$GITHUB_PATH"
      # The runner has no GPU: Chrome draws WebGL2 with SwiftShader, which webdriver.json enables.
      - run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test -p open-ng --target wasm32-unknown-unknown --test web --locked
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
